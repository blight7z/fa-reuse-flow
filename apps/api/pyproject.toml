[project]
name = "fa-reuse-flow-api"
version = "0.1.0"
description = "API for a synthetic factory-automation reuse workflow"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"] # FastAPI dependency marker.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
